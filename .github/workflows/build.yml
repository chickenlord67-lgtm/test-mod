name: Build SussyMod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup NDK r26b
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install LLVM 19
        run: |
          sudo apt-get install -y software-properties-common wget gnupg
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main"
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 libc++-19-dev libc++abi-19-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 100
          clang++ --version

      - name: Clone Geode SDK
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/geode-sdk/geode.git $HOME/geode-sdk
          echo "GEODE_SDK=$HOME/geode-sdk" >> $GITHUB_ENV

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Package .geode
        run: |
          mkdir -p pkg
          cp mod.json pkg/
          cp build/libSussyMod.so pkg/
          cd pkg && zip -r ../SussyMod.geode * && cd ..

      - name: Upload SussyMod.geode
        uses: actions/upload-artifact@v4
        with:
          name: SussyMod
          path: SussyMod.geode
          retention-days: 30
